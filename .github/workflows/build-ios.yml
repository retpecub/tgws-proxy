name: Build TgWsProxy iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Show Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Show SDK info
        run: |
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build main app
        working-directory: ios-app
        run: |
          set -euo pipefail

          APP_NAME="TgWsProxy"
          BUILD_DIR="$PWD/build"
          APP_DIR="$BUILD_DIR/Payload/$APP_NAME.app"

          mkdir -p "$APP_DIR"

          SOURCES=(
            TgWsProxy/Sources/TgWsProxyApp.swift
            TgWsProxy/Sources/ContentView.swift
            TgWsProxy/Sources/SettingsView.swift
            TgWsProxy/Sources/ProxyConfig.swift
            TgWsProxy/Sources/ProxyManager.swift
            TgWsProxy/Sources/Crypto.swift
            TgWsProxy/Sources/RawWebSocket.swift
            TgWsProxy/Sources/MTProtoHandshake.swift
            TgWsProxy/Sources/MTProtoProxyServer.swift
            TgWsProxy/Sources/LiveActivityManager.swift
          )

          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          swiftc \
            -target arm64-apple-ios17.0 \
            -sdk "$SDK" \
            -O \
            -whole-module-optimization \
            -import-objc-header /dev/null \
            -parse-as-library \
            -module-name "$APP_NAME" \
            -emit-executable \
            "${SOURCES[@]}" \
            -o "$APP_DIR/$APP_NAME" \
            -framework Foundation \
            -framework SwiftUI \
            -framework Network \
            -framework CryptoKit \
            -framework ActivityKit \
            -framework WidgetKit \
            -framework UserNotifications \
            -framework Security

          cp TgWsProxy/Resources/Info.plist "$APP_DIR/Info.plist"

      - name: Compile LiveActivity extension
        working-directory: ios-app
        run: |
          set -euo pipefail

          EXT_NAME="TgWsProxyLiveActivity"
          BUILD_DIR="$PWD/build"
          EXT_DIR="$BUILD_DIR/Payload/TgWsProxy.app/PlugIns/$EXT_NAME.appex"

          mkdir -p "$EXT_DIR"

          SOURCES=(
            TgWsProxy/LiveActivity/ProxyLiveActivity.swift
            TgWsProxy/Sources/LiveActivityManager.swift
          )

          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          swiftc \
            -target arm64-apple-ios17.0 \
            -sdk "$SDK" \
            -O \
            -whole-module-optimization \
            -import-objc-header /dev/null \
            -parse-as-library \
            -module-name "$EXT_NAME" \
            -emit-executable \
            "${SOURCES[@]}" \
            -o "$EXT_DIR/$EXT_NAME" \
            -framework Foundation \
            -framework SwiftUI \
            -framework ActivityKit \
            -framework WidgetKit

          cp TgWsProxy/LiveActivity/Info.plist "$EXT_DIR/Info.plist"

      - name: Copy app resources
        working-directory: ios-app
        run: |
          set -euo pipefail

          APP_DIR="$PWD/build/Payload/TgWsProxy.app"

          if [ -d "TgWsProxy/Resources" ]; then
            cp -R TgWsProxy/Resources/* "$APP_DIR/" || true
          fi

      - name: Create IPA
        working-directory: ios-app
        run: |
          set -euo pipefail
          cd build
          zip -r TgWsProxy-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TgWsProxy-unsigned-ipa
          path: ios-app/build/TgWsProxy-unsigned.ipa
